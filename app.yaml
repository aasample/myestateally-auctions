runtime: python311

service: default

instance_class: F2

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6

env_variables:
  FLASK_ENV: production
  FLASK_DEBUG: false
  USE_FIRESTORE: "true"  # Native Mode Firestore - data persists permanently!
  GOOGLE_CLOUD_PROJECT: estateally-ai-services
  GOOGLE_REDIRECT_URI: https://www.myestateally.com/auth/google/callback
  REQUIRE_AUTH_FOR_ALL: "false"  # Allow beta testing without auth
  # BETA_CODE stored in Secret Manager
  # Email Configuration (credentials stored in Secret Manager)
  MAIL_SERVER: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_USE_TLS: "true"
  MAIL_DEFAULT_SENDER: "MyEstateAlly <myestateally33@gmail.com>"
  APP_BASE_URL: "https://estateally-ai-services.ue.r.appspot.com"
  # GEMINI_API_KEY — stored in Google Cloud Secret Manager (secret name: GEMINI_API_KEY)

handlers:
- url: /static
  static_dir: src/static
  secure: always

- url: /.*
  script: auto
  secure: always
